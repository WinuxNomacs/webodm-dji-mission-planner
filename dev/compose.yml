# Added to WebODM's own docker-compose.yml and .dev.yml by dev/webodm.sh: a WebODM checkout runs in dev mode with
# this repo's plugin mounted as coreplugins/mission_planner, under its own container names (MP_PREFIX), port and
# volumes, so it can run beside other WebODMs (whose names and port it would take). The images (MP_*_IMAGE) are each
# version's, pinned by digest in dev/webodm.sh. The processing node is defined here: WebODM's own file for it was
# renamed in 4.0.0 (docker-compose.nodeodm.yml, then .nodeodx.yml).
services:
  db:
    image: ${MP_DB_IMAGE}
    container_name: ${MP_PREFIX}-db
  broker:
    image: ${MP_BROKER_IMAGE}
    container_name: ${MP_PREFIX}-broker
  node-odx-1:
    image: ${MP_NODE_IMAGE}
    container_name: ${MP_PREFIX}-node-odx-1
    expose:
      - "3000"
    restart: unless-stopped
    oom_score_adj: 500
  webapp:
    image: ${MP_WEBAPP_IMAGE}
    container_name: ${MP_PREFIX}-webapp
    depends_on:
      - node-odx-1
    environment:
      - WO_DEFAULT_NODES
      # The terrain and ground heights come from OpenTopography; the plugin also reads the key from its settings
      - WO_OPENTOPOGRAPHY_API_KEY
    ports: !override
      - "${WO_PORT}:8000/tcp"
      - "${MP_LIVERELOAD_PORT}:35729"
    volumes:
      - ${MP_PLUGIN_DIR}:/webodm/coreplugins/mission_planner
  worker:
    image: ${MP_WEBAPP_IMAGE}
    container_name: ${MP_PREFIX}-worker
    volumes:
      - ${MP_PLUGIN_DIR}:/webodm/coreplugins/mission_planner
